name: Firebase CI and release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify build, security, and browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      verified-sha: ${{ steps.verified.outputs.sha }}
    env:
      CI: "true"
      FIREBASE_EMULATORS_PATH: ${{ github.workspace }}/.cache/firebase/emulators
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Use Java 21 for Firebase emulators
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore Firebase emulator binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15.24.0

      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Reject production dependency advisories
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix functions audit --omit=dev --audit-level=high

      - name: Run complete repository verification
        run: npm run verify

      - name: Run Chrome E2E and responsive visual checks
        run: npm run test:e2e

      - name: Bind verification to this commit
        id: verified
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Retain failure evidence for three days
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: robotshift-ci-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            firebase-debug.log
            firebase-debug.*.log
          if-no-files-found: ignore
          retention-days: 3

  deploy:
    name: Deploy verified commit to Firebase
    needs: verify
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      CI: "true"
      FIREBASE_RELEASE_MODE: ci
      FIREBASE_RELEASE_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      ROBOTSHIFT_VERIFIED_SHA: ${{ needs.verify.outputs.verified-sha }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.verified-sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Authenticate with short-lived Google credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: robotshift
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: robotshift

      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Rebuild the verified static export
        run: npm run build

      - name: Deploy all coupled Firebase surfaces
        run: npm run release:firebase

      - name: Exercise the live responsive browser flows
        env:
          E2E_BASE_URL: https://robotshift.web.app
        run: npm run test:e2e

      - name: Retain deployment failure evidence for three days
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: robotshift-release-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            firebase-debug.log
            firebase-debug.*.log
          if-no-files-found: ignore
          retention-days: 3
