name: Bug report
description: Report a reproducible problem in the curriculum, UI, data flow, or tooling.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private learner data, Tutor conversations, production tokens, or unredacted logs. Report vulnerabilities through the private security link.
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Curriculum or lesson
        - Diagram or interactive maths
        - Navigation or responsive UI
        - Authentication or profile
        - Persistence or migration
        - Tutor
        - Local setup or verification
        - Deployment
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened? Include the exact day, route, or command when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest ordered set of steps.
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or deployment
      description: Commit SHA, branch, or https://robotshift.web.app.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, browser, and viewport. Remove usernames and local paths.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, tokens, private data, personal paths, and unredacted logs.
          required: true
